    <style>
        /* =========================================
           ANIMAÇÕES E ESTILOS CUSTOMIZADOS
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ocultar scrollbars horizontais, mas manter a rolagem */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animação de Surgimento (Fade e Slide Up) */
        .reveal-element {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-element.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animações de Keyframes */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 20px 10px rgba(245, 158, 11, 0.1); }
        }
        .animate-pulse-glow { animation: pulse-glow 3s infinite; }

        /* Efeitos de Interação (Toque/Hover) */
        .card-hover {
            transition: all 0.3s ease;
        }
        @media (hover: hover) {
            .card-hover:hover {
                transform: translateY(-4px) scale(1.01);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
        .card-hover:active {
            transform: scale(0.98);
        }

        /* Estilos de Impressão (PDF - FORMATO AGENDA COMPACTA) */
        @media print {
            @page { margin: 10mm; size: A4 portrait; }
            body { background: white !important; font-size: 10pt !important; color: black !important; }
            * { filter: none !important; opacity: 1 !important; } /* Remove efeitos de cinzento/transparência na impressão */
            
            /* Ocultar elementos desnecessários na impressão */
            .no-print, header p, .header-bg::before, #search-info, #month-tabs { display: none !important; }
            
            /* Header simplificado */
            header { 
                background: white !important; 
                color: black !important; 
                box-shadow: none !important; 
                padding: 0 0 10px 0 !important; 
                border-bottom: 2px solid #1e3a8a !important; 
                border-radius: 0 !important;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            header h1 { color: #1e3a8a !important; font-size: 22pt !important; margin: 0 !important; justify-content: center !important;}
            #display-date { display: block; margin-top: 4px; font-size: 11pt !important; color: #555 !important; border: none !important; background: none !important; }
            
            main { margin-top: 15px !important; padding: 0 !important; }
            
            /* Espaçamento das listas de meses */
            #birthday-list { space-y: 0 !important; display: flex; flex-direction: column; gap: 15px !important; }
            .print-month-section { margin-bottom: 10px !important; }
            
            /* Título do mês */
            .print-month-title {
                margin-bottom: 8px !important;
                border-bottom: 1px solid #cbd5e1 !important;
                padding-bottom: 2px !important;
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
            }
            .print-month-title h2 { font-size: 14pt !important; color: #1e3a8a !important; margin: 0 !important;}
            .print-month-title span { font-size: 10pt !important; color: #64748b !important; background: none !important; padding: 0 !important; }
            
            /* Grid Agenda (4 Colunas) */
            .print-grid { 
                display: grid !important; 
                grid-template-columns: repeat(4, 1fr) !important; 
                gap: 6px !important; 
            }
            
            /* Cartão de pessoa (Super compacto) */
            .print-card-bg { 
                background: white !important; 
                border: 1px solid #e2e8f0 !important; 
                box-shadow: none !important; 
                padding: 4px 6px !important;
                border-radius: 6px !important;
                display: flex !important;
                align-items: center !important;
                gap: 6px !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            
            /* Emblema da data */
            .print-date-badge {
                min-width: 26px !important;
                height: 26px !important;
                background: #f1f5f9 !important;
                border: 1px solid #cbd5e1 !important;
                color: #1e3a8a !important;
                border-radius: 4px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            .print-date-badge span:first-child { font-size: 12pt !important; font-weight: bold !important; margin: 0 !important; line-height: 1;}
            .print-date-badge span:last-child { display: none !important; } /* Oculta a sigla do mês (JAN, FEV) */
            
            /* Textos do cartão */
            .print-info-group { display: flex !important; flex-direction: column !important; justify-content: center !important; overflow: hidden; }
            .print-info-group h3 { font-size: 8.5pt !important; margin: 0 !important; color: black !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
            .print-info-group div { gap: 2px !important; margin-top: 1px !important;}
            .print-info-group div span { font-size: 7pt !important; background: none !important; padding: 0 !important; color: #64748b !important; line-height: 1.2;}
            .print-info-group i { display: none !important; } /* Ocultar ícone de maleta */
            
            /* Oculta os selos de "É HOJE" na impressão */
            .print-card-bg > div.absolute { display: none !important; }
            .reveal-element { opacity: 1 !important; transform: none !important; transition: none !important; }
        }

        /* Background do Header com Glassmorphism */
        .header-bg {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            position: relative;
            overflow: hidden;
        }
        .header-bg::before {
            content: '';
            position: absolute;
            top: -50%; left: -20%; width: 60%; height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(30deg);
            filter: blur(40px);
        }
    </style>

    </header>

        </div>

    </main>

        };

        const currentMonth = state.currentDate.getMonth() + 1;
        const currentDay = state.currentDate.getDate();
        const currentYear = state.currentDate.getFullYear();

        // Ordenar dados
        const sortedBirthdays = [...BIRTHDAYS].sort((a, b) => a.day - b.day);

        // --- 3. FUNÇÕES UTILITÁRIAS ---
        function getBirthdayStatus(day, month) {
            if (month < currentMonth) return 'passed';
            if (month === currentMonth && day < currentDay) return 'passed';
            if (month === currentMonth && day === currentDay) return 'today';
            return 'upcoming';
        }

        function getTodaysBirthdays() {
            return BIRTHDAYS.filter(b => b.day === currentDay && b.month === currentMonth);
        }

        function getUpcomingBirthdays() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            return BIRTHDAYS.filter(person => {
                if (person.day === currentDay && person.month === currentMonth) return false;

                let bday = new Date(today.getFullYear(), person.month - 1, person.day);
                if (bday < today) bday.setFullYear(today.getFullYear() + 1);
                
                const diffTime = Math.abs(bday - today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                person.daysLeft = diffDays;
                return diffDays > 0 && diffDays <= 20;
            }).sort((a, b) => a.daysLeft - b.daysLeft);
        }

        function getFilteredBirthdays() {
            return sortedBirthdays.filter(person => {
                const matchesSearch = person.name.toLowerCase().includes(state.searchQuery) ||
                                      person.role.toLowerCase().includes(state.searchQuery);
                const matchesMonth = state.selectedMonth === 'all' || person.month === state.selectedMonth;
                return matchesSearch && matchesMonth;
            });
        }

        function getDaysLeftText(days) {
            if (days === 1) return 'Amanhã!';
            return `Em ${days} dias`;
        }

        // --- 4. OBSERVERS PARA ANIMAÇÕES AO ROLAR (SCROLL) ---
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
        const scrollObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target); // Anima só uma vez
                }
            });
        }, observerOptions);

        function observeElements() {
            document.querySelectorAll('.reveal-element').forEach(el => {
                scrollObserver.observe(el);
            });
        }

        // --- 5. FUNÇÕES DE RENDERIZAÇÃO DOM ---

        function renderHeaderDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('display-date').textContent = state.currentDate.toLocaleDateString('pt-BR', options);
        }

        function renderTodaySection() {
            const todays = getTodaysBirthdays();
            const section = document.getElementById('today-section');
            
            if (state.searchQuery || state.selectedMonth !== 'all' || todays.length === 0) {
                section.classList.add('hidden');
                return;
            }

            let cardsHtml = todays.map(person => `
                <div class="bg-gradient-to-r from-orange-50 to-amber-50 p-5 sm:p-6 rounded-2xl border border-orange-200 flex items-center gap-5 sm:gap-6 card-hover">
                    <div class="min-w-[4.5rem] sm:min-w-[5.5rem] h-20 sm:h-24 bg-gradient-to-br from-orange-400 to-amber-500 rounded-2xl flex items-center justify-center text-white shadow-inner font-black text-3xl sm:text-4xl border-4 border-white shadow-md">
                        ${String(person.day).padStart(2, '0')}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-xl sm:text-2xl font-extrabold text-slate-800 leading-tight truncate">${person.name}</h3>
                        <p class="text-orange-700 font-semibold flex items-center gap-1.5 mt-2 text-sm sm:text-lg">
                            <i class="ph-fill ph-briefcase"></i> <span class="truncate">${person.role}</span>
                        </p>
                    </div>
                </div>
            `).join('');

            section.innerHTML = `
                <div class="animate-pulse-glow bg-gradient-to-br from-yellow-400 via-amber-400 to-orange-500 rounded-[2.5rem] p-1 shadow-2xl shadow-orange-500/30 transform transition-all duration-500">
                    <div class="bg-white/95 backdrop-blur-xl rounded-[2.3rem] p-6 sm:p-10 relative overflow-hidden">
                        <i class="ph-fill ph-sparkle absolute top-6 right-6 text-yellow-400 opacity-50 text-7xl animate-pulse"></i>
                        <div class="absolute -top-20 -right-20 w-80 h-80 bg-yellow-300 rounded-full blur-[90px] opacity-40"></div>
                        
                        <div class="relative z-10">
                            <div class="flex items-center gap-4 mb-8">
                                <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-4 rounded-3xl shadow-lg animate-bounce">
                                    <i class="ph-fill ph-gift text-3xl sm:text-4xl"></i>
                                </div>
                                <h2 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight flex flex-wrap items-center gap-3">
                                    É HOJE! 🎉
                                    <span class="text-base font-bold text-orange-600 bg-orange-100 px-4 py-1.5 rounded-full">Parabéns!</span>
                                </h2>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                ${cardsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            section.classList.remove('hidden');
        }

        function renderUpcomingSection() {
            const upcoming = getUpcomingBirthdays();
            const section = document.getElementById('upcoming-section');
            
            if (state.searchQuery || state.selectedMonth !== 'all' || upcoming.length === 0) {
                section.classList.add('hidden');
                return;
            }

            // Cartões maiores e mais elegantes
            let cardsHtml = upcoming.map((person, idx) => `
                <div class="flex-shrink-0 w-72 sm:w-[22rem] bg-slate-50 p-5 sm:p-6 rounded-[2rem] border border-slate-200/80 snap-start relative card-hover shadow-sm hover:shadow-xl transition-shadow">
                    <div class="absolute -top-3 right-6 bg-slate-800 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-full shadow-md z-10 border-2 border-white">
                        ${getDaysLeftText(person.daysLeft)}
                    </div>
                    <div class="flex items-center gap-4 sm:gap-5 mt-2">
                        <div class="flex flex-col items-center justify-center min-w-[4.5rem] sm:min-w-[5rem] h-16 sm:h-20 rounded-[1.2rem] font-black bg-white text-brand-600 border border-brand-100 shadow-md">
                            <span class="text-2xl sm:text-3xl leading-none">${String(person.day).padStart(2, '0')}</span>
                            <span class="text-[10px] sm:text-[11px] uppercase mt-1 tracking-wider opacity-80">${MONTHS[person.month - 1].slice(0, 3)}</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-extrabold text-slate-800 truncate text-lg sm:text-xl" title="${person.name}">${person.name.split(' ')[0]} ${person.name.split(' ').slice(-1)}</p>
                            <p class="text-sm sm:text-base text-slate-500 font-medium truncate mt-1" title="${person.role}">${person.role}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            section.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 print-card-bg">
                    <div class="flex items-center justify-between px-2 mb-4">
                        <h2 class="text-2xl sm:text-3xl font-black text-slate-800 flex items-center gap-3">
                            <i class="ph-fill ph-calendar-heart text-brand-500 text-4xl"></i> Vem aí...
                        </h2>
                    </div>
                    <div class="flex overflow-x-auto gap-5 sm:gap-6 pb-6 pt-6 px-2 snap-x hide-scrollbar">
                        ${cardsHtml}
                    </div>
                </div>
            `;
            section.classList.remove('hidden');
        }

        function renderMonthTabs() {
            const container = document.getElementById('month-tabs');
            
            let html = `
                <button onclick="setMonth('all')" class="whitespace-nowrap px-6 sm:px-8 py-3 sm:py-3.5 rounded-2xl font-bold text-base transition-all duration-300 snap-start ${
                    state.selectedMonth === 'all' 
                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/30 scale-100 sm:scale-105' 
                        : 'bg-transparent text-slate-500 hover:bg-slate-100 hover:text-slate-800'
                }">
                    Visão Geral
                </button>
            `;

            MONTHS.forEach((month, index) => {
                const monthNum = index + 1;
                const hasBirthdays = BIRTHDAYS.some(b => b.month === monthNum);
                const isSelected = state.selectedMonth === monthNum;
                
                html += `
                    <button onclick="setMonth(${monthNum})" class="whitespace-nowrap px-5 sm:px-6 py-3 sm:py-3.5 rounded-2xl font-semibold text-base transition-all duration-300 flex items-center gap-2 snap-start ${
                        isSelected 
                            ? 'bg-slate-800 text-white shadow-lg scale-100 sm:scale-105' 
                            : 'bg-transparent text-slate-500 hover:bg-slate-100 hover:text-slate-800'
                    }">
                        ${month}
                        ${hasBirthdays ? `<span class="w-2 h-2 rounded-full ${isSelected ? 'bg-brand-400' : 'bg-slate-300'}"></span>` : ''}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function renderMainList() {
            const filtered = getFilteredBirthdays();
            const listContainer = document.getElementById('birthday-list');
            const searchInfo = document.getElementById('search-info');
            const emptyState = document.getElementById('empty-state');

            // Search Info
            if (state.searchQuery) {
                searchInfo.textContent = `Encontrados ${filtered.length} resultados para "${state.searchQuery}"`;
                searchInfo.classList.remove('hidden');
            } else {
                searchInfo.classList.add('hidden');
            }

            // Empty state
            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Render List Grouped by Month
            let listHtml = '';
            
            MONTHS.forEach((monthName, index) => {
                const monthNum = index + 1;
                if (state.selectedMonth !== 'all' && state.selectedMonth !== monthNum) return;

                const monthBirthdays = filtered.filter(b => b.month === monthNum);
                if (monthBirthdays.length === 0) return;

                let cardsHtml = monthBirthdays.map((person, idx) => {
                    // Verifica status do aniversário
                    const status = getBirthdayStatus(person.day, person.month);
                    const isToday = status === 'today';
                    const isPassed = status === 'passed';
                    
                    // Definição visual baseada no status
                    const cardBgClass = isToday ? 'border-orange-300 shadow-xl shadow-orange-100/50 bg-orange-50/40' 
                                      : isPassed ? 'border-slate-200 bg-slate-50/80 opacity-60 grayscale-[80%] hover:grayscale-0 hover:opacity-100 transition-all duration-300' 
                                      : 'border-slate-100 shadow-lg bg-white';
                                      
                    const badgeBgClass = isToday ? 'bg-gradient-to-br from-orange-400 to-amber-500 text-white shadow-orange-200 border-none' 
                                       : isPassed ? 'bg-slate-200 text-slate-500 border-slate-300'
                                       : 'bg-brand-50 text-brand-600 border-brand-100 shadow-sm group-hover:bg-brand-600 group-hover:text-white group-hover:border-brand-500 group-hover:shadow-brand-200';

                    return `
                        <div class="reveal-element group relative p-6 sm:p-8 rounded-[2rem] border print-card-bg card-hover ${cardBgClass}" style="transition-delay: ${idx * 30}ms">
                            
                            ${isToday ? `
                                <div class="absolute -top-4 -right-4 bg-gradient-to-tr from-orange-500 to-amber-400 text-white text-[11px] sm:text-xs uppercase font-black px-4 sm:px-5 py-1.5 sm:py-2 rounded-full shadow-lg flex items-center gap-2 border-2 border-white z-10">
                                    <i class="ph-fill ph-gift text-sm"></i> É HOJE!
                                </div>
                            ` : ''}
                            
                            <div class="flex items-center gap-5 sm:gap-6">
                                <div class="print-date-badge flex flex-col items-center justify-center min-w-[4.5rem] sm:min-w-[5.5rem] h-20 sm:h-24 rounded-2xl border transition-colors duration-300 ${badgeBgClass}">
                                    <span class="text-3xl sm:text-4xl font-black leading-none tracking-tighter">${String(person.day).padStart(2, '0')}</span>
                                    <span class="text-[10px] sm:text-[12px] font-bold uppercase mt-1 tracking-widest opacity-90">${monthName.slice(0, 3)}</span>
                                </div>

                                <div class="print-info-group flex-1 min-w-0">
                                    <h3 class="font-extrabold text-slate-800 truncate text-lg sm:text-2xl mb-1.5 group-hover:text-brand-600 transition-colors" title="${person.name}">${person.name}</h3>
                                    <div class="flex items-center gap-2 text-sm sm:text-base text-slate-500 font-medium">
                                        <span class="p-1.5 sm:p-2 bg-slate-100 rounded-lg group-hover:bg-brand-50 transition-colors">
                                            <i class="ph-fill ph-briefcase text-slate-400 group-hover:text-brand-400"></i>
                                        </span>
                                        <span class="truncate" title="${person.role || 'Colaborador'}">${person.role || 'Colaborador'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                listHtml += `
                    <div class="print-month-section mb-14">
                        <div class="print-month-title flex items-center gap-3 sm:gap-5 mb-8 px-2 reveal-element">
                            <h2 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">${monthName}</h2>
                            <div class="h-1 bg-slate-200 flex-1 rounded-full no-print"></div>
                            <span class="text-sm sm:text-base font-bold text-slate-500 bg-slate-100 px-4 sm:px-5 py-1.5 sm:py-2 rounded-full shadow-inner">
                                ${monthBirthdays.length} ${monthBirthdays.length === 1 ? 'pessoa' : 'pessoas'}
                            </span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 print-grid">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = listHtml;
            observeElements(); // Re-aplicar observer aos novos elementos
        }

        function renderAll() {
            renderTodaySection();
            renderUpcomingSection();
            renderMonthTabs();
            renderMainList();
        }

        // --- 6. EVENTOS E INTERAÇÕES ---

        // Input de Busca
        document.getElementById('search-input').addEventListener('input', (e) => {
            state.searchQuery = e.target.value.toLowerCase();
            renderAll();
        });

        // Clique nas Abas (Chamada pelo HTML inline)
        window.setMonth = function(month) {
            state.selectedMonth = month;
            renderAll();
            
            // Scroll suave para o topo da lista no mobile
            if(window.innerWidth < 768) {
                document.getElementById('month-tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        // Limpar Filtros
        window.clearFilters = function() {
            document.getElementById('search-input').value = '';
            state.searchQuery = '';
            state.selectedMonth = 'all';
            renderAll();
        };

        // --- 7. SISTEMA DE NOTIFICAÇÕES (COM LOCALSTORAGE/COOKIES) ---
        function checkNotificationStatus() {
            // Verifica se o utilizador já ativou explicitamente no passado
            const userEnabled = localStorage.getItem('caj_notifications') === 'enabled';
            
            if ("Notification" in window && Notification.permission === "granted" && userEnabled) {
                state.notificationsEnabled = true;
                updateNotifyButtonUI();
                checkAndFireNotification();
            } else {
                state.notificationsEnabled = false;
                updateNotifyButtonUI();
            }
        }

        window.toggleNotifications = function() {
            if (!("Notification" in window)) {
                alert("O seu navegador não suporta notificações.");
                return;
            }

            // Se já está ativo, permite ao utilizador desativar
            if (state.notificationsEnabled) {
                state.notificationsEnabled = false;
                localStorage.setItem('caj_notifications', 'disabled');
                updateNotifyButtonUI();
                return;
            }

            // Se não está ativo, pede permissão
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    state.notificationsEnabled = true;
                    // Salva no "cookie" (localStorage) a escolha do utilizador
                    localStorage.setItem('caj_notifications', 'enabled');
                    updateNotifyButtonUI();
                    checkAndFireNotification();
                } else {
                    alert("As notificações foram bloqueadas. Permita o acesso nas configurações do navegador para usar esta funcionalidade.");
                }
            });
        };

        function updateNotifyButtonUI() {
            const btn = document.getElementById('btn-notify');
            const icon = document.getElementById('icon-notify');
            const text = document.getElementById('text-notify');
            
            if (state.notificationsEnabled) {
                btn.className = "flex-1 lg:flex-none flex items-center justify-center gap-2 px-5 py-4 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/30 rounded-2xl backdrop-blur-md transition-all font-bold text-sm sm:text-base text-emerald-50 active:scale-95";
                icon.className = "ph-fill ph-bell-ringing text-emerald-300 text-xl";
                text.textContent = "Notificações Ativas";
            } else {
                btn.className = "flex-1 lg:flex-none flex items-center justify-center gap-2 px-5 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl backdrop-blur-md transition-all font-bold text-sm sm:text-base text-white active:scale-95";
                icon.className = "ph ph-bell text-xl";
                text.textContent = "Ativar Notificações";
            }
        }

        function checkAndFireNotification() {
            const dateStr = `${currentYear}-${currentMonth}-${currentDay}`;
            const lastNotified = localStorage.getItem('caj_last_notification_date');
            const todays = getTodaysBirthdays();

            if (state.notificationsEnabled && todays.length > 0 && lastNotified !== dateStr) {
                const names = todays.map(b => b.name).join(", ");
                new Notification("🎉 Temos Aniversariantes Hoje!", {
                    body: `Dê os parabéns a: ${names}`,
                    icon: "https://cdn-icons-png.flaticon.com/512/3159/3159073.png" // Ícone genérico de festa
                });
                // Grava a data para não notificar duas vezes no mesmo dia
                localStorage.setItem('caj_last_notification_date', dateStr);
            }
        }

        // --- 8. INICIALIZAÇÃO ---
        window.addEventListener('DOMContentLoaded', () => {
            renderHeaderDate();
            renderAll();
            checkNotificationStatus();
            
            // Garantir que a animação inicial do banner aconteça
            setTimeout(() => {
                const el = document.getElementById('upcoming-section');
                if(el) el.classList.add('active');
            }, 100);
        });

    </script>
</body>
</html>
